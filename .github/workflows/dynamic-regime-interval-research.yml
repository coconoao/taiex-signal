name: Dynamic regime and conformal interval research tests

on:
  pull_request:
    paths:
      - "regime_interval_research.py"
      - "regime_router.py"
      - "research_regime_backtest.py"
      - "tests/test_regime_interval_research.py"
      - ".github/workflows/dynamic-regime-interval-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run dynamic regime and interval unit tests
        run: pytest -q tests/test_regime_interval_research.py
      - name: Test official Taiwan calendar gate
        run: pytest -q tests/test_research_regime_backtest_calendar.py
      - name: Compile research modules
        run: python -m py_compile regime_interval_research.py regime_router.py research_regime_backtest.py
