name: Refresh daily news research

on:
  push:
    paths:
      - "news_policy_research.py"
      - "news_history_import.py"
      - "news_mediacloud.py"
      - "news_enhanced_model.py"
      - "news.py"
      - "news_snapshot.py"
      - "news_research_maintenance.py"
      - "storage.py"
      - ".github/workflows/refresh-news-research.yml"
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiex-daily-news-research
  cancel-in-progress: true

jobs:
  refresh-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAIEX_STORAGE: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: pip install -r requirements.txt
      - name: Restore persisted market and news data
        run: python storage.py restore
      - name: Build official policy-news historical alignment
        run: python news_policy_research.py
      - name: Refresh RSS news sources every calendar day
        run: python news.py
      - name: Collect daily news snapshot
        run: python news_snapshot.py
      - name: Label completed TAIEX sessions and update research summary
        run: python news_research_maintenance.py
      - name: Train and score the separate news-enhanced research model
        run: python news_enhanced_model.py
      - name: Persist routine news research
        run: python storage.py save
      - name: Persist official policy-news research
        run: python storage.py save-policy-research
      - name: Refresh independent GDELT history and current holiday window
        run: python news_history_import.py --current-only --days 30
      - name: Persist independent GDELT research
        run: python storage.py save-gdelt-research
      - name: Refresh independent Media Cloud news metadata
        run: python news_mediacloud.py
      - name: Persist independent Media Cloud research
        run: python storage.py save-mediacloud-research
      - name: Persist news-enhanced model output
        run: python storage.py save-news-enhanced-model
