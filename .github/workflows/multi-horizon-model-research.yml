name: Multi-horizon model research

on:
  push:
    paths:
      - ".github/workflows/multi-horizon-model-research.yml"
      - "multi_horizon_model_research.py"
      - "model_improvement_research.py"
      - "pipeline.py"
      - "storage.py"
      - "tests/test_multi_horizon_model_research.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-horizon-model-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAIEX_STORAGE: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore canonical data
        run: python storage.py restore
      - name: Test multi-horizon research
        run: python -m unittest discover -s tests -p "test_multi_horizon_model_research.py"
      - name: Run isolated multi-horizon experiments
        run: python multi_horizon_model_research.py
      - name: Persist research artifact only
        run: python storage.py save-multi-horizon-model-research
