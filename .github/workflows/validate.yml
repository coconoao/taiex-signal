name: Validate application

on:
  push:
    branches: [main, feature/google-oauth-security, fix/pipeline-incremental-checkpoints]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run news rules-only unit tests
        run: timeout 90s python -m unittest discover -s tests -p 'test_news_model_status.py' -v
      - name: Run isolated security unit tests
        run: python -m unittest discover -s tests -v
      - name: Run isolated demo pipeline smoke test
        run: |
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          (cd "$tmpdir" && python "$GITHUB_WORKSPACE/pipeline.py" --demo)
          python - "$tmpdir" <<'PY'
          import json
          import pathlib
          import sys

          directory = pathlib.Path(sys.argv[1])
          required = ("signals.json", "weekly.json", "weekly_prob.csv")
          missing = [name for name in required if not (directory / name).is_file()]
          if missing:
              raise SystemExit(f"Demo pipeline did not create: {missing}")

          signals = json.loads((directory / "signals.json").read_text(encoding="utf-8"))
          weekly = json.loads((directory / "weekly.json").read_text(encoding="utf-8"))
          if signals.get("demo") is not True:
              raise SystemExit("Expected demo output marker")
          if signals.get("schema_version") != 2:
              raise SystemExit("Expected schema-v2 daily forecast output")
          forecast = signals.get("forecast", {})
          if forecast.get("schema_version") != 2 or len(forecast.get("sessions", [])) != 3:
              raise SystemExit("Expected three schema-v2 forecast sessions")
          router = forecast.get("regime_router", {})
          routed_sessions = router.get("sessions", [])
          if router.get("routing_priority") != "router_first" or len(routed_sessions) != 3:
              raise SystemExit("Expected three independent router-first horizon outputs")
          for session in routed_sessions:
              if session.get("status") != "research":
                  raise SystemExit(f"Demo router horizon is not research-ready: {session}")
              probabilities = session.get("regime_probabilities", {})
              if set(probabilities) != {"low", "normal", "high", "extreme"}:
                  raise SystemExit("Router probability output is missing a regime")
              if abs(sum(probabilities.values()) - 1.0) > 0.001:
                  raise SystemExit("Router regime scores do not sum to one")
              if not session.get("expert_used"):
                  raise SystemExit("Router did not identify the selected expert")
              router_validation = session.get("router_validation", {})
              forecast_validation = session.get("routed_forecast_validation", {})
              if router_validation.get("status") != "available" or forecast_validation.get("status") != "available":
                  raise SystemExit("Demo router must include out-of-sample classification and forecast metrics")
              print(
                  "Router D+{}: regime={} expert={} OOS={} macro-F1={} high/extreme-recall={} routed-MAE={} global-MAE={}".format(
                      session["horizon_sessions"], session["regime"], session["expert_used"],
                      router_validation["oos_samples"], router_validation["macro_f1"],
                      router_validation["high_extreme_recall"],
                      forecast_validation["routed_mae_points"], forecast_validation["global_ridge_mae_points"],
                  )
              )
          if not signals.get("legacy_direction_model", {}).get("backtest", {}).get("curve", {}).get("dates"):
              raise SystemExit("Legacy research backtest curve is empty")
          if not weekly.get("asof") or "prob_up" not in weekly:
              raise SystemExit("Weekly report is incomplete")
          print("Demo pipeline generated valid daily, weekly, and chart data.")
          PY
      - name: Check inline dashboard JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dashboard.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(source => source.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found');
          scripts.forEach((source, index) => {
            new Function(source);
            console.log(`Inline script ${index + 1}: syntax OK`);
          });
          NODE
