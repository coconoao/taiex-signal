name: Validate application

on:
  push:
    branches: [main, feature/google-oauth-security]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run isolated security unit tests
        run: python -m unittest discover -s tests -v
      - name: Check inline dashboard JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dashboard.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(source => source.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found');
          scripts.forEach((source, index) => {
            new Function(source);
            console.log(`Inline script ${index + 1}: syntax OK`);
          });
          NODE
