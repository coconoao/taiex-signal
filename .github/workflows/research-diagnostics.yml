name: Research diagnostics and leakage tests

on:
  push:
    branches:
      - feat/diagnostics-and-leakage-tests
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-diagnostics:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run read-only offline diagnostics
        if: always()
        run: python scripts/run_offline_diagnostics.py --download-sample --period 5y --output-dir artifacts
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-model-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
