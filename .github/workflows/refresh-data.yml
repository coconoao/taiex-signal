name: Refresh market data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-data.yml"
      - "pipeline.py"
  schedule:
    # 00:30 UTC Sunday-Thursday = 08:30 Taiwan Monday-Friday, before the TAIEX open.
    # At this cutoff, the prior Taiwan session and completed U.S. session are available.
    - cron: "30 0 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiex-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # This workflow writes to the production Supabase project. Never run it from a feature/PR branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAIEX_STORAGE: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore previous data
        run: python storage.py restore
      - name: Migrate legacy market and forecast data to schema v2
        run: python storage.py migrate-v2
      - name: Refresh Taiwan market pipeline
        run: python pipeline.py
        # Keep persistence and news refresh running if model training lacks enough complete samples.
        continue-on-error: true
      - name: Persist Taiwan market data
        run: python storage.py save
      - name: Refresh news
        run: python news.py
      - name: Persist news data
        run: python storage.py save
