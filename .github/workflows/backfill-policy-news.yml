name: Backfill official historical policy news

on:
  push:
    branches:
      - main
    paths:
      - "news_policy_archive_backfill.py"
      - "storage.py"
      - "dashboard.html"
      - ".github/workflows/backfill-policy-news.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiex-official-policy-news-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAIEX_STORAGE: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore existing site data
        run: python storage.py restore
      - name: Import official historical news metadata
        run: python news_policy_archive_backfill.py
      - name: Build official policy-news historical alignment
        run: python news_policy_research.py
      - name: Persist archive to Supabase
        run: python storage.py save-policy-archive
      - name: Persist policy research artifact
        run: python storage.py save
